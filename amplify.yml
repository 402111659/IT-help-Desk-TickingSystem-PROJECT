version: 1
applications:
  - appRoot: ticketing-frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist/ticketing-frontend/browser
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*